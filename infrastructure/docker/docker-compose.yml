version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: phantom-postgres
    restart: always
    environment:
      POSTGRES_USER: phantom
      POSTGRES_PASSWORD: phantom
      POSTGRES_DB: phantombotai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: phantom-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: